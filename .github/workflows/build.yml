name: Build & Push

on:
  workflow_dispatch:
    inputs:
      qbee_version:
        description: 'QBEE version to build (e.g. 5.1.3.10)'
        required: true
        type: string
      push_latest:
        description: 'Also tag this build as :latest'
        required: false
        default: true
        type: boolean
      force:
        description: 'Force rebuild even if tag already exists'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [upstream-release]
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qbittorrent-ee
  QBEE_REPO: c0re100/qBittorrent-Enhanced-Edition

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve QBEE version & tagging behavior
        id: ver
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              VER="${{ inputs.qbee_version }}"
              PUSH_LATEST="${{ inputs.push_latest }}"
              FORCE="${{ inputs.force }}"
              ;;
            repository_dispatch)
              # Triggered by check-upstream cron — by definition this IS latest.
              VER="${{ github.event.client_payload.qbee_version }}"
              PUSH_LATEST="true"
              FORCE="false"
              ;;
            push)
              # Re-build current upstream latest on Dockerfile/entrypoint changes.
              VER=$(curl -fsSL "https://api.github.com/repos/${QBEE_REPO}/releases/latest" \
                    | jq -r .tag_name | sed 's/^release-//')
              PUSH_LATEST="true"
              FORCE="true"
              ;;
            *)
              echo "::error::Unsupported event ${{ github.event_name }}"; exit 1
              ;;
          esac
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "::error::QBEE version is empty"; exit 1
          fi
          echo "version=$VER"          >> "$GITHUB_OUTPUT"
          echo "push_latest=$PUSH_LATEST" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE"          >> "$GITHUB_OUTPUT"
          echo "::notice::Building QBEE $VER (push_latest=$PUSH_LATEST, force=$FORCE)"

      - name: Compute upstream artifact SHA256
        id: hash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          URL="https://github.com/${QBEE_REPO}/releases/download/release-${VER}/qbittorrent-enhanced-nox_x86_64-linux-musl_static.zip"
          echo "Fetching $URL for hashing"
          curl -fsSL --retry 3 -o /tmp/nox.zip "$URL"
          SHA=$(sha256sum /tmp/nox.zip | awk '{print $1}')
          SIZE=$(stat -c %s /tmp/nox.zip)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"  >> "$GITHUB_OUTPUT"
          echo "::notice::QBEE $VER artifact size=$SIZE bytes sha256=$SHA"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version tag already exists in GHCR
        id: check
        if: steps.ver.outputs.force != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          IMG="${REGISTRY}/${IMAGE_NAME}:${VER}"
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMG already exists, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute final tag list
        id: tags
        if: steps.ver.outputs.force == 'true' || steps.check.outputs.exists != 'true'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAGS="${REGISTRY}/${IMAGE_NAME}:${VER}"
          if [ "${{ steps.ver.outputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.ver.outputs.force == 'true' || steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        if: steps.ver.outputs.force == 'true' || steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            QBEE_VERSION=${{ steps.ver.outputs.version }}
            QBEE_SHA256=${{ steps.hash.outputs.sha256 }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Already up to date
        if: steps.ver.outputs.force != 'true' && steps.check.outputs.exists == 'true'
        run: |
          echo "::notice::Image for QBEE ${{ steps.ver.outputs.version }} already published. Nothing to do."
